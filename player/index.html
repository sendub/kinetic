<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinetic</title>
    <style>
      /* The player is index.html + app.js + manifest.js, so its styles live
         here: a content folder copied with these three files plays offline
         with nothing else to carry. */
      :root {
        color-scheme: dark;
        --ink: #f4efe6;
        --accent: #e6b566;
        --ui-font: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* The stage is the viewport, and so is the media box: `object-fit:
         contain` then paints the largest version of the asset that fits
         inside it, aspect ratio kept, centered (docs/plan.md Phase 7b). The
         letterbox therefore comes only from the mismatch between the asset's
         own aspect and the screen's — never from the manifest, whose
         width/height describe the asset, not a box to fit to. Nothing here
         takes a size, so one rule covers images, animation frames and video
         on a single element (all frames of an animation share a size, so the
         aspect is stable while frames swap). Scaling up is included: a small
         asset fills the screen. Same rule as arithmetic: src/render/fit.ts. */
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
      }
      /* The key help's black screen hides the stage itself, media and all
         (docs/plan.md Phase 13b); this beats `.stage`'s own display, same
         pattern as `#bookmarks[hidden]` and `#config[hidden]` below. */
      .stage[hidden] {
        display: none;
      }
      .visual {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .notice {
        margin: auto;
        max-width: 68ch;
        padding: clamp(16px, 3vh, 32px) clamp(20px, 4vw, 44px);
        border: 1px solid rgba(244, 239, 230, 0.22);
        border-radius: 4px;
        background: rgba(10, 10, 12, 0.6);
        color: var(--ink);
        font: 500 clamp(14px, 1.7vh, 20px) / 1.45 var(--ui-font);
        letter-spacing: 0.02em;
        text-align: center;
      }
      /* Lower third. Sits over the visual, never beside it. Every line in
         the band — speaker, dialogue, thought — is centered (docs/plan.md
         Phase 16, Styling); the band's geometry is untouched. */
      .overlay {
        position: absolute;
        inset: auto 0 0 0;
        padding: clamp(24px, 6vh, 72px) clamp(20px, 7vw, 112px)
          clamp(24px, 6vh, 64px);
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.84) 35%,
          rgba(0, 0, 0, 0)
        );
        color: var(--ink);
        font-family: var(--ui-font);
        pointer-events: none;
        text-align: center;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay-speaker {
        margin: 0 0 0.55em;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      /* The line's own column is centered in the band, not just its text:
         `margin: 0 auto` keeps a short `max-width` block from hugging the
         left edge on wide screens. */
      .overlay-text {
        margin: 0 auto;
        max-width: 74ch;
        font-size: clamp(17px, 2.3vh, 28px);
        line-height: 1.5;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
        white-space: pre-line;
      }
      /* Thought vs dialogue (docs/plan.md Phase 7b): an unspoken thought is
         italic and pastel-blue, spoken dialogue stays upright and in the
         default ink. `data-mode` comes from render/overlay.ts and the whole
         distinction lives here, so the look can change without touching
         logic — the first styling pass of docs/plan.md Phase 16 picked the
         blue: #b9d4e8 reads clearly over the dark band and the inherited
         text-shadow keeps the edges legible. The look stays open to further
         iteration with the user; the band's geometry is not part of it. */
      .overlay-text[data-mode="thought"] {
        font-style: italic;
        color: #b9d4e8;
      }
      /* t bookmark overlay (docs/plan.md Phase 8, README t bullet): one
         panel owns the screen while open, and the cursor-moving keys are
         suspended behind it (render/keys.ts). The list runs oldest at the
         top down to newest at the bottom and scrolls, so opening lands at
         the bottom — the most recent thumbnail visible. The z-index keeps
         it over stage and overlay but under the #flash pill (z 10), so a
         `b` taken while browsing still confirms on screen. Sizes stay
         proportional to the viewport; nothing here takes the manifest's
         display size, same as the stage above. */
      #bookmarks {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: clamp(8px, 1.8vh, 20px);
        padding: clamp(16px, 3vh, 36px) clamp(20px, 6vw, 88px);
        background: rgba(8, 8, 10, 0.94);
        color: var(--ink);
        font-family: var(--ui-font);
      }
      #bookmarks[hidden] {
        display: none;
      }
      .bookmarks-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .bookmarks-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      .bookmarks-list {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: clamp(8px, 1.5vh, 16px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding-right: 4px;
      }
      .bookmarks-list[hidden] {
        display: none;
      }
      .bookmark-entry {
        flex: none;
        display: flex;
        align-items: center;
        gap: clamp(10px, 2vw, 18px);
        min-height: clamp(56px, 12vh, 120px);
        padding: clamp(6px, 1vh, 12px) clamp(10px, 2vw, 18px);
        border: 1px solid rgba(244, 239, 230, 0.16);
        border-radius: 6px;
        background: rgba(18, 18, 22, 0.9);
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .bookmark-entry:hover,
      .bookmark-entry:focus-visible {
        border-color: var(--accent);
        background: rgba(30, 30, 36, 0.95);
        outline: none;
      }
      /* The thumbnail keeps the asset's aspect at a list-row height;
         `contain` so an oddly shaped still letterboxes inside its box. */
      .bookmark-thumb {
        display: block;
        height: clamp(32px, 8vh, 72px);
        width: auto;
        object-fit: contain;
        border-radius: 3px;
        background: #000;
      }
      .bookmark-thumb-empty {
        width: clamp(56px, 14vw, 128px);
      }
      /* The thumbnail's box positions its delete "x" (docs/plan.md Phase
         18, "Delete a bookmark") on the thumbnail's top-right corner. */
      .bookmark-thumb-box {
        position: relative;
        flex: none;
        display: block;
      }
      .bookmark-delete {
        position: absolute;
        top: 2px;
        right: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(18px, 2.6vh, 26px);
        height: clamp(18px, 2.6vh, 26px);
        border: 1px solid rgba(244, 239, 230, 0.4);
        border-radius: 50%;
        background: rgba(10, 10, 12, 0.92);
        color: var(--ink);
        font-size: clamp(12px, 1.8vh, 18px);
        line-height: 1;
        cursor: pointer;
      }
      .bookmark-delete:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .bookmark-meta {
        display: flex;
        flex-direction: column;
        gap: 0.3em;
        min-width: 0;
      }
      .bookmark-time {
        font-variant-numeric: tabular-nums;
        font-size: clamp(12px, 1.6vh, 18px);
      }
      .bookmark-label {
        color: rgba(244, 239, 230, 0.62);
        font-size: clamp(10px, 1.3vh, 14px);
        letter-spacing: 0.04em;
      }
      .bookmarks-empty {
        margin: auto;
        color: rgba(244, 239, 230, 0.7);
        font-size: clamp(14px, 1.8vh, 20px);
        letter-spacing: 0.02em;
      }
      /* c config screen (docs/plan.md Phase 9, README c bullet): one
         panel, the player's settings — the reading-speed slider with its
         step buttons, the skip-all, skip-plays-videos and
         play-all-routes switches — and nothing else. Same level as the bookmark panel
         (under the #flash pill, z 10, so a `b` still confirms on top),
         and the cursor-moving keys are suspended behind it
         (render/keys.ts). Sizes stay viewport-proportional, as above.
         The look is deliberately minimal: like the overlay band, the
         final styling is a later iteration with the user. */
      #config {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 2.4vh, 28px);
        padding: clamp(16px, 3vh, 36px) clamp(20px, 6vw, 88px);
        background: rgba(8, 8, 10, 0.94);
        color: var(--ink);
        font-family: var(--ui-font);
      }
      #config[hidden] {
        display: none;
      }
      .config-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .config-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      .config-row {
        display: flex;
        align-items: center;
        gap: clamp(10px, 2vw, 18px);
      }
      .config-label {
        /* The longest label, "Skip plays videos", keeps the controls in
           one column. */
        min-width: 18ch;
        font-size: clamp(13px, 1.7vh, 19px);
      }
      .config-value {
        min-width: 18ch;
        font-variant-numeric: tabular-nums;
        font-size: clamp(13px, 1.7vh, 19px);
      }
      /* The current speed is a readout, not a control, and it rides at the
         row's right of the slider (docs/plan.md Phase 16), so it reads
         smaller and dimmer than the row's own label — the panel's hint
         size and the dim value colour, both already used above. */
      .config-speed-value {
        min-width: 0;
        color: rgba(244, 239, 230, 0.62);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      /* Reading-speed slider (docs/plan.md Phase 16): the native range
         input between the − and + buttons, redrawn in this panel's own
         palette — a hairline track in the border colour, the accent on
         the thumb. `appearance: none` is what lets the track and thumb
         be drawn at all; the thumb is a fixed 14px because a webkit thumb
         centers on its track by a margin of half the difference, so the
         two sizes belong together. Keyboard is untouched: arrows step it. */
      .config-slider {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: clamp(160px, 24vw, 320px);
        height: 16px;
        margin: 0;
        background: transparent;
        cursor: pointer;
      }
      .config-slider::-webkit-slider-runnable-track {
        height: 4px;
        border: none;
        border-radius: 2px;
        background: rgba(244, 239, 230, 0.22);
      }
      .config-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
      }
      .config-slider::-moz-range-track {
        height: 4px;
        border: none;
        border-radius: 2px;
        background: rgba(244, 239, 230, 0.22);
      }
      .config-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
      }
      .config-slider:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 3px;
      }
      .config-step,
      .config-toggle {
        padding: clamp(3px, 0.8vh, 8px) clamp(10px, 1.8vw, 18px);
        border: 1px solid rgba(244, 239, 230, 0.16);
        border-radius: 6px;
        background: rgba(18, 18, 22, 0.9);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      .config-step {
        font-size: clamp(14px, 1.8vh, 20px);
        line-height: 1.2;
      }
      .config-toggle {
        font-size: clamp(13px, 1.7vh, 19px);
      }
      .config-step:hover,
      .config-step:focus-visible,
      .config-toggle:hover,
      .config-toggle:focus-visible {
        border-color: var(--accent);
        background: rgba(30, 30, 36, 0.95);
        outline: none;
      }
      /* The switch reads its own state, so the panel shows the value
         without relying on position alone. */
      .config-toggle[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* Reset-confirmation box (docs/plan.md Phase 16): the `c` panel's
         "Reset progress" row opens it, centered over everything — above
         the config panel (z 5) and help (z 6), still under the #flash
         pill (z 10). Same dark family as the panels; the reader's own
         buttons decide, and Escape/n simply cancels. */
      #confirm {
        position: absolute;
        inset: 0;
        z-index: 7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 2.4vh, 28px);
        padding: clamp(16px, 3vh, 36px) clamp(20px, 6vw, 88px);
        background: rgba(8, 8, 10, 0.94);
        color: var(--ink);
        font-family: var(--ui-font);
        text-align: center;
      }
      #confirm[hidden] {
        display: none;
      }
      .confirm-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .confirm-message {
        margin: 0;
        max-width: 52ch;
        font-size: clamp(13px, 1.7vh, 19px);
        line-height: 1.5;
      }
      .confirm-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      .confirm-actions {
        display: flex;
        gap: clamp(10px, 2vw, 18px);
      }
      /* The buttons share the config panel's control skin: same border,
         hover and focus ring; the destructive one carries the accent. */
      .confirm-button {
        padding: clamp(4px, 1vh, 10px) clamp(14px, 2.4vw, 26px);
        border: 1px solid rgba(244, 239, 230, 0.16);
        border-radius: 6px;
        background: rgba(18, 18, 22, 0.9);
        color: var(--ink);
        font: inherit;
        font-size: clamp(13px, 1.7vh, 19px);
        cursor: pointer;
      }
      .confirm-button:hover,
      .confirm-button:focus-visible {
        border-color: var(--accent);
        background: rgba(30, 30, 36, 0.95);
        outline: none;
      }
      .confirm-reset {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* Key help screen (docs/plan.md Phase 13b): black over everything —
         the stage is hidden too, so the screen really is black, not just
         covered. Opaque background, above the bookmark/config panels (z 5)
         and still under the #flash pill (z 10); the rows are built from
         the keymap's own table (render/keys.ts), and its keys close it.
         Look is minimal, same as the panels above: a later iteration with
         the user. */
      #help {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 2.4vh, 28px);
        padding: clamp(16px, 3vh, 36px) clamp(20px, 6vw, 88px);
        background: #000;
        color: var(--ink);
        font-family: var(--ui-font);
      }
      #help[hidden] {
        display: none;
      }
      .help-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .help-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      .help-list {
        display: flex;
        flex-direction: column;
        gap: clamp(5px, 1vh, 12px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .help-row {
        display: flex;
        align-items: baseline;
        gap: clamp(10px, 2vw, 18px);
      }
      .help-key {
        flex: none;
        min-width: 14ch;
        padding: clamp(2px, 0.5vh, 5px) clamp(8px, 1.4vw, 14px);
        border: 1px solid rgba(244, 239, 230, 0.28);
        border-radius: 5px;
        background: rgba(18, 18, 22, 0.9);
        font: inherit;
        font-size: clamp(11px, 1.4vh, 16px);
        letter-spacing: 0.06em;
        text-align: center;
      }
      .help-desc {
        color: rgba(244, 239, 230, 0.8);
        font-size: clamp(12px, 1.6vh, 18px);
      }
      /* Decision overlay (docs/plan.md Phase 13): the machine's open
         choice drawn as a prompt over its numbered routes. z 5: it never
         coexists with the bookmark/config panels (one screen at a time),
         and the key help — the one screen that may open OVER a pending
         choice — stays above it at z 6; #flash (z 10) is unaffected.
         Rows are buttons so a pointer click is the row's own; the seen
         marker rides at the row's end. Look is minimal like the panels
         above: a later iteration with the user. */
      #choice {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(12px, 2.4vh, 28px);
        padding: clamp(16px, 3vh, 36px) clamp(20px, 6vw, 88px);
        background: rgba(8, 8, 10, 0.94);
        color: var(--ink);
        font-family: var(--ui-font);
      }
      #choice[hidden] {
        display: none;
      }
      .choice-title {
        margin: 0 auto;
        max-width: 60ch;
        color: var(--accent);
        font-size: clamp(16px, 2.4vh, 26px);
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: 0.02em;
        text-align: center;
      }
      .choice-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
        text-align: center;
      }
      /* Rows are centered as whole rows (docs/plan.md Phase 16, Styling):
         `align-items: center` shrinks each button to its content and puts
         it on the panel's center line, so number badge, label and seen
         marker stay inline as one centered unit. */
      .choice-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(6px, 1.2vh, 14px);
        margin: 0 auto;
        max-width: 72ch;
      }
      .choice-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2vw, 18px);
        padding: clamp(8px, 1.6vh, 16px) clamp(12px, 2vw, 22px);
        border: 1px solid rgba(244, 239, 230, 0.28);
        border-radius: 8px;
        background: rgba(18, 18, 22, 0.9);
        color: var(--ink);
        font: inherit;
        font-size: clamp(14px, 1.9vh, 21px);
        text-align: center;
        cursor: pointer;
      }
      .choice-row:hover,
      .choice-row:focus-visible {
        border-color: var(--accent);
        background: rgba(30, 28, 24, 0.95);
      }
      .choice-continue {
        border-style: dashed;
      }
      .choice-num {
        flex: none;
        min-width: 2.2em;
        padding: clamp(2px, 0.5vh, 5px) clamp(6px, 1.2vw, 12px);
        border: 1px solid rgba(244, 239, 230, 0.28);
        border-radius: 5px;
        background: rgba(10, 10, 12, 0.9);
        color: var(--accent);
        font-size: clamp(11px, 1.4vh, 16px);
        letter-spacing: 0.06em;
        text-align: center;
      }
      .choice-label {
        flex: 1;
        line-height: 1.4;
      }
      .choice-seen {
        flex: none;
        color: rgba(244, 239, 230, 0.5);
        font-size: clamp(10px, 1.2vh, 13px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      /* Play-all back-in-time interstitial (docs/plan.md Phase 18): a
         black screen the machine holds ~2.5 s before the next route. Above
         the choice panel (they never coexist) and below #flash. */
      #interstitial {
        position: absolute;
        inset: 0;
        z-index: 7;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: clamp(10px, 2vh, 24px);
        padding: clamp(16px, 3vh, 36px) clamp(20px, 6vw, 88px);
        background: #000;
        color: var(--ink);
        font-family: var(--ui-font);
        text-align: center;
      }
      #interstitial[hidden] {
        display: none;
      }
      .interstitial-title {
        margin: 0;
        color: rgba(244, 239, 230, 0.6);
        font-size: clamp(11px, 1.4vh, 15px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .interstitial-context {
        margin: 0;
        max-width: 60ch;
        color: rgba(244, 239, 230, 0.75);
        font-style: italic;
        font-size: clamp(13px, 1.8vh, 19px);
      }
      .interstitial-prompt {
        margin: 0;
        max-width: 60ch;
        color: var(--accent);
        font-size: clamp(16px, 2.4vh, 26px);
        font-weight: 600;
      }
      .interstitial-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(6px, 1.2vh, 12px);
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .interstitial-row {
        display: flex;
        gap: 14px;
        align-items: baseline;
        padding: clamp(6px, 1.2vh, 12px) clamp(12px, 2vw, 22px);
        border: 1px solid rgba(244, 239, 230, 0.18);
        border-radius: 8px;
        color: rgba(244, 239, 230, 0.6);
        font-size: clamp(14px, 1.9vh, 21px);
      }
      .interstitial-now {
        border-color: var(--accent);
        color: var(--ink);
        background: rgba(40, 34, 24, 0.9);
        font-weight: 600;
      }
      .interstitial-status {
        color: rgba(244, 239, 230, 0.5);
        font-size: clamp(10px, 1.2vh, 13px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .interstitial-now .interstitial-status {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- manifest.js sets window.KINETIC_MANIFEST and must run first: over
         file:// nothing can fetch manifest.json, so the manifest has to be
         embedded before app.js asks for it. -->
    <script src="manifest.js"></script>
    <script src="app.js"></script>
  </body>
</html>
