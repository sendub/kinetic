<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinetic</title>
    <style>
      /* The player is index.html + app.js + manifest.js, so its styles live
         here: a content folder copied with these three files plays offline
         with nothing else to carry. */
      :root {
        color-scheme: dark;
        --ink: #f4efe6;
        --accent: #e6b566;
        --ui-font: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* The stage is the viewport, and so is the media box: `object-fit:
         contain` then paints the largest version of the asset that fits
         inside it, aspect ratio kept, centered (docs/plan.md Phase 7b). The
         letterbox therefore comes only from the mismatch between the asset's
         own aspect and the screen's — never from the manifest, whose
         width/height describe the asset, not a box to fit to. Nothing here
         takes a size, so one rule covers images, animation frames and video
         on a single element (all frames of an animation share a size, so the
         aspect is stable while frames swap). Scaling up is included: a small
         asset fills the screen. Same rule as arithmetic: src/render/fit.ts. */
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
      }
      /* The key help's black screen hides the stage itself, media and all
         (docs/plan.md Phase 13b); this beats `.stage`'s own display, same
         pattern as `#config[hidden]` below. */
      .stage[hidden] {
        display: none;
      }
      .visual {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .notice {
        margin: auto;
        max-width: 68ch;
        padding: clamp(16px, 3vh, 32px) clamp(20px, 4vw, 44px);
        border: 1px solid rgba(244, 239, 230, 0.22);
        border-radius: 4px;
        background: rgba(10, 10, 12, 0.6);
        color: var(--ink);
        font: 500 clamp(14px, 1.7vh, 20px) / 1.45 var(--ui-font);
        letter-spacing: 0.02em;
        text-align: center;
      }
      /* Lower third. Sits over the visual, never beside it. Every line in
         the band — speaker, dialogue, thought — is centered (docs/plan.md
         Phase 16, Styling); the band's geometry is untouched. */
      .overlay {
        position: absolute;
        inset: auto 0 0 0;
        padding: clamp(24px, 6vh, 72px) clamp(20px, 7vw, 112px)
          clamp(24px, 6vh, 64px);
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.84) 35%,
          rgba(0, 0, 0, 0)
        );
        color: var(--ink);
        font-family: var(--ui-font);
        pointer-events: none;
        text-align: center;
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay-speaker {
        margin: 0 0 0.55em;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      /* The line's own column is centered in the band, not just its text:
         `margin: 0 auto` keeps a short `max-width` block from hugging the
         left edge on wide screens. */
      .overlay-text {
        margin: 0 auto;
        max-width: 74ch;
        font-size: clamp(17px, 2.3vh, 28px);
        line-height: 1.5;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
        white-space: pre-line;
      }
      /* Thought vs dialogue (docs/plan.md Phase 7b): an unspoken thought is
         italic and pastel-blue, spoken dialogue stays upright and in the
         default ink. `data-mode` comes from render/overlay.ts and the whole
         distinction lives here, so the look can change without touching
         logic — the first styling pass of docs/plan.md Phase 16 picked the
         blue: #b9d4e8 reads clearly over the dark band and the inherited
         text-shadow keeps the edges legible. The look stays open to further
         iteration with the user; the band's geometry is not part of it. */
      .overlay-text[data-mode="thought"] {
        font-style: italic;
        color: #b9d4e8;
      }
      /* The settings section of the Esc screen (docs/plan.md Phase 9;
         Phase 26 moved it into #help, under the key grid, and dropped
         `c`): the auto-forward speed slider with its step buttons, the
         "When Tab skips" options (skip unseen content too, play videos in
         full), the play-all-routes switch and the Progress group (export,
         import, reset; Phase 21) — and nothing else. It flows inside the
         #help panel, which owns the z-order, the black background and the
         vertical scroll. Sizes stay viewport-proportional, as above. */
      #config {
        display: flex;
        flex-direction: column;
        gap: clamp(4px, 1.2vh, 16px);
      }
      #config[hidden] {
        display: none;
      }
      .config-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .config-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      .config-row {
        display: flex;
        align-items: center;
        gap: clamp(10px, 2vw, 18px);
      }
      /* The skip options sit under their own heading, indented, so they
         read as options of Tab rather than switches that start a skip. */
      .config-section {
        margin: 0 0 calc(-1 * clamp(2px, 0.8vh, 10px));
        color: rgba(244, 239, 230, 0.7);
        font-size: clamp(11px, 1.4vh, 15px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .config-option {
        padding-left: clamp(12px, 2vw, 24px);
      }
      .config-note {
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      /* The speed row's note line (Phase 24), drawn up under its row as
         a heading draws up its first option. */
      .config-speed-note {
        margin: calc(-1 * clamp(2px, 0.8vh, 10px)) 0 0;
      }
      /* A group's own note line (Phase 22), under its heading. */
      .config-group-note {
        margin: 0;
      }
      /* The Progress group's message line (Phase 21): an import refusal
         or an export's confirmation, under the group, in the accent. */
      .config-message {
        margin: 0;
        max-width: 64ch;
        padding-left: clamp(12px, 2vw, 24px);
        color: var(--accent);
        font-size: clamp(11px, 1.4vh, 15px);
      }
      .config-label {
        /* The longest label, "Skip unseen content too", keeps the
           controls in one column. */
        min-width: 24ch;
        font-size: clamp(13px, 1.7vh, 19px);
      }
      /* The indent comes out of the label, so the controls still line up. */
      .config-option .config-label {
        min-width: calc(24ch - clamp(12px, 2vw, 24px));
      }
      .config-value {
        min-width: 18ch;
        font-variant-numeric: tabular-nums;
        font-size: clamp(13px, 1.7vh, 19px);
      }
      /* The current speed is a readout, not a control, and it rides at the
         row's right of the slider (docs/plan.md Phase 16), so it reads
         smaller and dimmer than the row's own label — the panel's hint
         size and the dim value colour, both already used above. */
      .config-speed-value {
        /* One line at any width: "1.00x — ~60 ms/char" wrapped at 700x900
           (Phase 24); the slider gives way instead (below). */
        flex: none;
        white-space: nowrap;
        color: rgba(244, 239, 230, 0.62);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      /* Reading-speed slider (docs/plan.md Phase 16): the native range
         input between the − and + buttons, redrawn in this panel's own
         palette — a hairline track in the border colour, the accent on
         the thumb. `appearance: none` is what lets the track and thumb
         be drawn at all; the thumb is a fixed 14px because a webkit thumb
         centers on its track by a margin of half the difference, so the
         two sizes belong together. Keyboard is untouched: arrows step it. */
      .config-slider {
        appearance: none;
        -webkit-appearance: none;
        /* Shrinks (down to 80px) before the one-line readout overflows. */
        flex: 0 1 clamp(160px, 24vw, 320px);
        min-width: 80px;
        height: 16px;
        margin: 0;
        background: transparent;
        cursor: pointer;
      }
      .config-slider::-webkit-slider-runnable-track {
        height: 4px;
        border: none;
        border-radius: 2px;
        background: rgba(244, 239, 230, 0.22);
      }
      .config-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
      }
      .config-slider::-moz-range-track {
        height: 4px;
        border: none;
        border-radius: 2px;
        background: rgba(244, 239, 230, 0.22);
      }
      .config-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
      }
      .config-slider:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 3px;
      }
      .config-step,
      .config-toggle {
        padding: clamp(3px, 0.8vh, 8px) clamp(10px, 1.8vw, 18px);
        border: 1px solid rgba(244, 239, 230, 0.16);
        border-radius: 6px;
        background: rgba(18, 18, 22, 0.9);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      .config-step {
        font-size: clamp(14px, 1.8vh, 20px);
        line-height: 1.2;
      }
      .config-toggle {
        font-size: clamp(13px, 1.7vh, 19px);
      }
      .config-step:hover,
      .config-step:focus-visible,
      .config-toggle:hover,
      .config-toggle:focus-visible {
        border-color: var(--accent);
        background: rgba(30, 30, 36, 0.95);
        outline: none;
      }
      /* The switch reads its own state, so the panel shows the value
         without relying on position alone. */
      .config-toggle[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* The branch map (docs/plan.md Phase 31, render/branchmap.ts): the
         decision tree on the panels' dark ground, opaque so the game does
         not show through the lines. z 6: over
         a pending choice (z 5), which it may open above; it never
         coexists with the Esc screen (also z 6) — each replaces the
         other — and stays under the reset box (z 7) and the #flash pill
         (z 10). A one-line header (Phase 33): the title and its buttons,
         each naming its key in its hover hint; under it the view, taking
         all the height left, which owns every pointer and wheel event
         (touch-action: none: no browser pan or zoom). No text on it is
         selectable, so a drag pan or a double click never selects any:
         Safari reads only the -webkit- form. */
      #branchmap {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        background: rgb(8, 8, 10);
        color: var(--ink);
        font-family: var(--ui-font);
        -webkit-user-select: none;
        user-select: none;
      }
      #branchmap[hidden] {
        display: none;
      }
      .map-head {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px clamp(12px, 2vw, 28px);
        padding: clamp(8px, 1.4vh, 16px) clamp(16px, 4vw, 64px);
        border-bottom: 1px solid rgba(244, 239, 230, 0.12);
      }
      .map-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .map-tools {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .map-tool {
        min-width: 2.4em;
        padding: clamp(3px, 0.6vh, 7px) clamp(10px, 1.2vw, 16px);
        border: 1px solid rgba(244, 239, 230, 0.16);
        border-radius: 6px;
        background: rgba(18, 18, 22, 0.9);
        color: var(--ink);
        font: inherit;
        font-size: clamp(12px, 1.5vh, 16px);
        cursor: pointer;
      }
      .map-tool:hover,
      .map-tool:focus-visible {
        border-color: var(--accent);
        background: rgba(30, 30, 36, 0.95);
        outline: none;
      }
      /* Newest bookmark with no bookmarks: there, but greyed. */
      .map-tool:disabled {
        border-color: rgba(244, 239, 230, 0.16);
        background: rgba(18, 18, 22, 0.9);
        color: rgba(244, 239, 230, 0.4);
        cursor: default;
      }
      /* A control's instant hint (the branch map's buttons, a bookmark's
         delete "x"): drawn from its data-hint below it, right-aligned to
         it so a control at the window's right edge keeps it on screen,
         shown with no delay on hover or keyboard focus. Replaces the
         native title, which Chrome shows late and Safari not at all in
         fullscreen. The "/ ''" alt text keeps it out of the control's
         accessible name; the control carries the text itself
         (aria-describedby or aria-label). */
      .map-tool[data-hint] {
        position: relative;
      }
      /* Fallback for a browser without alt text in content (dropped
         there as invalid by the next rule). */
      [data-hint]::after {
        content: attr(data-hint);
      }
      [data-hint]::after {
        content: attr(data-hint) / "";
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 8;
        padding: 4px 8px;
        border: 1px solid rgba(244, 239, 230, 0.22);
        border-radius: 6px;
        background: rgba(10, 10, 12, 0.96);
        color: var(--ink);
        font-family: var(--ui-font);
        font-size: clamp(11px, 1.4vh, 14px);
        font-weight: normal;
        letter-spacing: normal;
        line-height: 1.35;
        text-transform: none;
        white-space: nowrap;
        pointer-events: none;
        visibility: hidden;
        opacity: 0;
      }
      [data-hint]:hover::after,
      [data-hint]:focus-visible::after {
        visibility: visible;
        opacity: 1;
      }
      /* The Spoilers switch reads its state, like the Esc screen's. */
      .map-tool[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* The view paints its own ground and clips and isolates what moves
         inside it (Phase 35, a Safari lesson): when the map does not fill
         the view, the area it leaves is repainted, never left holding
         stale pixels. */
      .map-view {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        background: rgb(8, 8, 10);
        isolation: isolate;
        contain: paint;
        cursor: grab;
        touch-action: none;
      }
      .map-view.map-dragging {
        cursor: grabbing;
      }
      /* The stage (render/branchmap.ts): everything that moves with the
         view, the tree's SVG, the bookmark cards and the marker, in world
         units under ONE transform, so lines and cards can never drift
         apart. Sized to the layout; the SVGs fill it and may draw past it
         (the marker's label at the layout's edge). */
      .map-stage {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }
      .map-svg,
      .map-cards {
        position: absolute;
        top: 0;
        left: 0;
      }
      .map-svg {
        display: block;
        overflow: visible;
      }
      .map-top {
        pointer-events: none;
      }
      .map-svg text {
        fill: var(--ink);
        font-family: var(--ui-font);
        font-size: 15px;
      }
      /* Level of detail (render/branchmap.ts): near, the culled node
         groups with their text; far, only the skeleton's boxes. */
      .map-svg.map-far .map-detail,
      .map-svg:not(.map-far) .map-skeleton {
        display: none;
      }
      /* Far out a dash would cost its whole length in dashes per frame;
         the marks read by brightness alone there. */
      .map-svg.map-far path {
        stroke-dasharray: none;
      }
      .map-view.map-pointing {
        cursor: pointer;
      }
      .map-conn,
      .map-join,
      .map-return,
      .map-wrap,
      .map-run {
        fill: none;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }
      .map-conn,
      .map-join {
        stroke: rgba(244, 239, 230, 0.4);
        stroke-width: 2;
      }
      /* A row's end to the next row's start: the main line wrapping like a
         line of text. */
      .map-wrap {
        stroke: rgba(244, 239, 230, 0.4);
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .map-return {
        stroke: rgba(244, 239, 230, 0.4);
        stroke-width: 2;
        stroke-dasharray: 6 6;
      }
      .map-run {
        stroke-width: 3;
      }
      .map-run-seen {
        stroke: rgba(244, 239, 230, 0.85);
      }
      .map-run-partly {
        stroke: rgba(244, 239, 230, 0.55);
        stroke-dasharray: 10 5;
      }
      .map-run-unseen {
        stroke: rgba(244, 239, 230, 0.22);
        stroke-dasharray: 3 6;
      }
      .map-svg .map-count {
        fill: rgba(244, 239, 230, 0.5);
        font-size: 12px;
        text-anchor: middle;
      }
      /* A stretch holding cards says its screens and bookmarks under
         them, from its left end. */
      .map-svg .map-count-cards {
        font-size: 11px;
        fill: rgba(244, 239, 230, 0.45);
        text-anchor: start;
      }
      .map-dot {
        fill: rgba(244, 239, 230, 0.6);
      }
      .map-end {
        fill: rgba(244, 239, 230, 0.45);
      }
      .map-node rect,
      .map-box {
        fill: rgba(18, 18, 22, 0.95);
        stroke: rgba(244, 239, 230, 0.3);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .map-node.map-reached {
        cursor: pointer;
      }
      .map-node:focus {
        outline: none;
      }
      .map-dec.map-reached rect,
      .map-box.map-dec.map-reached {
        stroke: rgba(244, 239, 230, 0.6);
      }
      /* Compact nodes (Phase 35): a decision's "played/total", a route's
         choice number; the full text is in the tooltip. Their baseline
         (render/branchmap.ts) centres the figures in the node. */
      .map-svg .map-dec-c,
      .map-svg .map-route-c {
        font-size: 13px;
        font-weight: 600;
        text-anchor: middle;
      }
      .map-route.map-route-played rect,
      .map-box.map-route-played {
        fill: rgba(52, 46, 36, 0.95);
      }
      .map-route.map-route-unseen rect,
      .map-box.map-route-unseen {
        stroke-dasharray: 4 4;
      }
      /* The last pick at each decision: the choice screen's walk-route
         look (.choice-next), the route the wheel follows. */
      .map-node.map-last rect,
      .map-box.map-last {
        stroke: var(--accent);
        stroke-width: 2.5;
        fill: rgba(42, 35, 22, 0.95);
      }
      /* Not reached yet: drawn, but faded and inert. Faded by colour,
         not group opacity, which would cost a layer per node. */
      .map-node.map-inert {
        cursor: default;
      }
      .map-node.map-inert rect,
      .map-box.map-inert {
        fill: rgba(14, 14, 16, 0.95);
        stroke: rgba(244, 239, 230, 0.16);
        stroke-dasharray: 4 4;
      }
      .map-svg .map-node.map-inert text {
        fill: rgba(244, 239, 230, 0.4);
      }
      /* Hover / focus on anything clickable. */
      .map-node.map-reached:hover rect,
      .map-node.map-reached:focus-visible rect {
        stroke: var(--accent);
        stroke-width: 2.5;
      }
      .map-here-ring {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3;
      }
      .map-here-dot {
        fill: var(--accent);
      }
      .map-svg .map-here-label {
        fill: var(--accent);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-anchor: middle;
        paint-order: stroke;
        stroke: rgba(8, 8, 10, 0.9);
        stroke-width: 4px;
      }
      .map-here {
        pointer-events: none;
      }
      .map-tip {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
        max-width: min(46ch, 80vw);
        padding: 8px 12px;
        border: 1px solid rgba(244, 239, 230, 0.22);
        border-radius: 6px;
        background: rgba(10, 10, 12, 0.96);
        color: var(--ink);
        font-size: clamp(12px, 1.5vh, 16px);
        line-height: 1.35;
        pointer-events: none;
      }
      .map-tip[hidden] {
        display: none;
      }
      .map-tip span {
        color: rgba(244, 239, 230, 0.6);
        font-size: 0.85em;
      }
      /* Bookmark cards (Phase 35, replacing the `t` screen): in world
         units on the stage, so at 100% a card is the old screen's 280 x
         158 px thumbnail (its time in the hover tooltip), and at Fit it
         shrinks with the tree. The newest has the accent border. */
      .bm-card {
        position: absolute;
        width: 280px;
        height: 158px;
        box-sizing: border-box;
        border: 1px solid rgba(244, 239, 230, 0.16);
        border-radius: 6px;
        background: rgb(20, 20, 24);
        cursor: pointer;
      }
      /* The hover ring and the newest's outline are 2 screen pixels at
         any zoom (--px, a screen pixel in world units, set by
         render/branchmap.ts), so the newest stands out at Fit too. */
      .bm-card:hover {
        border-color: var(--accent);
        box-shadow: 0 0 0 calc(2px * var(--px, 1)) var(--accent);
      }
      .bm-card.bm-newest {
        border-color: var(--accent);
        box-shadow: 0 0 0 calc(2px * var(--px, 1)) var(--accent);
      }
      .bm-thumb {
        height: 100%;
        overflow: hidden;
        border-radius: 5px;
        background: rgb(32, 32, 38);
      }
      .bm-thumb > .bm-pic {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* The delete x, at every zoom: shown on the card's hover, drawn at a
         fixed screen size whatever the zoom (--del-scale, set per frame by
         render/branchmap.ts), anchored to the card's top-right corner, so
         it stays a usable target at Fit. Its hint is the instant
         [data-hint] one. */
      .bm-del {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 1;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid rgba(244, 239, 230, 0.4);
        border-radius: 50%;
        background: rgba(10, 10, 12, 0.92);
        color: var(--ink);
        font: inherit;
        font-size: 17px;
        line-height: 21px;
        text-align: center;
        cursor: pointer;
        transform: scale(var(--del-scale, 1));
        transform-origin: 100% 0;
        visibility: hidden;
      }
      .bm-card:hover .bm-del {
        visibility: visible;
      }
      .bm-del:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* Its hint at its usual screen size whatever the x's own scale. */
      .bm-del[data-hint]::after {
        top: calc(100% + 4px);
        transform: scale(var(--hint-scale, 1));
        transform-origin: 100% 0;
      }
      .bm-ghost {
        display: none;
      }
      /* Deleted while the map is open: a dashed ghost in its place (its
         outline 1.5 screen pixels at any zoom) with an Undo, until the map
         closes; a click anywhere on it undoes too. */
      .bm-card.bm-deleted {
        border: calc(1.5px * var(--px, 1)) dashed rgba(244, 239, 230, 0.5);
        background: transparent;
        box-shadow: none;
      }
      .bm-card.bm-deleted > :not(.bm-ghost) {
        display: none;
      }
      .bm-card.bm-deleted .bm-ghost {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 100%;
        color: rgba(244, 239, 230, 0.55);
        font-size: 14px;
      }
      .bm-undo {
        padding: 5px 14px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: none;
        color: var(--accent);
        font: inherit;
        cursor: pointer;
      }
      /* Far out a ghost's words are unreadable: it is just its dashed
         outline (a click on it, the toast's Undo or Z puts it back). */
      .map-cards-small .bm-card.bm-deleted .bm-ghost {
        visibility: hidden;
      }
      /* The undo toast: every delete offers it in screen space, so it is
         usable at any zoom (a ghost's own Undo is tiny at Fit). */
      .map-toast {
        position: absolute;
        left: 50%;
        bottom: 18px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 10px 8px 14px;
        border: 1px solid rgba(244, 239, 230, 0.22);
        border-radius: 6px;
        background: rgba(10, 10, 12, 0.96);
        font-size: 14px;
        transform: translateX(-50%);
      }
      .map-toast[hidden] {
        display: none;
      }
      .map-undo {
        padding: 4px 12px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: none;
        color: var(--accent);
        font: inherit;
        cursor: pointer;
      }
      /* Reset-confirmation box (docs/plan.md Phase 16): the Esc screen's
         "Reset progress" row opens it, centered over everything — above
         the Esc screen (#help, z 6), still under the #flash
         pill (z 10). Same dark family as the panels; the reader's own
         buttons decide, and Escape/n simply cancels. */
      #confirm {
        position: absolute;
        inset: 0;
        z-index: 7;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 2.4vh, 28px);
        padding: clamp(16px, 3vh, 36px) clamp(20px, 6vw, 88px);
        background: rgba(8, 8, 10, 0.94);
        color: var(--ink);
        font-family: var(--ui-font);
        text-align: center;
      }
      #confirm[hidden] {
        display: none;
      }
      .confirm-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .confirm-message {
        margin: 0;
        max-width: 52ch;
        font-size: clamp(13px, 1.7vh, 19px);
        line-height: 1.5;
      }
      .confirm-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      .confirm-actions {
        display: flex;
        gap: clamp(10px, 2vw, 18px);
      }
      /* The buttons share the settings' control skin: same border,
         hover and focus ring; the destructive one carries the accent. */
      .confirm-button {
        padding: clamp(4px, 1vh, 10px) clamp(14px, 2.4vw, 26px);
        border: 1px solid rgba(244, 239, 230, 0.16);
        border-radius: 6px;
        background: rgba(18, 18, 22, 0.9);
        color: var(--ink);
        font: inherit;
        font-size: clamp(13px, 1.7vh, 19px);
        cursor: pointer;
      }
      .confirm-button:hover,
      .confirm-button:focus-visible {
        border-color: var(--accent);
        background: rgba(30, 30, 36, 0.95);
        outline: none;
      }
      .confirm-reset {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* The Esc screen (docs/plan.md Phase 13b; Phase 26): black over
         everything — the stage is hidden too, so the screen really is
         black, not just covered. Opaque background, above a pending
         choice (z 5) and still under the reset box
         (z 7) and the #flash pill (z 10); the game's name, the key grid
         built from the keymap's own table (render/keys.ts), then the
         settings section (#config). Its keys close it. A window too short
         for it all scrolls vertically inside the screen, never across. */
      #help {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-content: start;
        gap: clamp(5px, 1.2vh, 20px) clamp(16px, 3vw, 40px);
        padding: clamp(10px, 2vh, 32px) clamp(16px, 6vw, 88px);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: #000;
        color: var(--ink);
        font-family: var(--ui-font);
      }
      /* The game's name (docs/plan.md Phase 21), from the manifest
         `title`: the screen's first line, above the keys; absent when
         the manifest names no game. */
      .help-game {
        margin: 0;
        color: var(--ink);
        font-size: clamp(20px, 3.4vh, 38px);
        font-weight: 600;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      .help-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(12px, 1.5vh, 17px);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .help-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
      }
      /* One column of sections, each the full width; the panel scrolls
         rather than squashing one. The header row is the exception: the
         game's name on the left, the hint on the right of the same line
         (stacked again on a narrow window). */
      #help > * {
        grid-column: 1 / -1;
        min-width: 0;
      }
      #help > .help-game {
        grid-column: 1;
      }
      #help > .help-hint {
        grid-column: 2;
        align-self: center;
        text-align: right;
      }
      @media (max-width: 560px) {
        #help > .help-game,
        #help > .help-hint {
          grid-column: 1 / -1;
          text-align: left;
        }
      }
      #help[hidden] {
        display: none;
      }
      /* The keys fill across before going down (Phase 26): a grid whose
         cells line up in rows and columns. Each entry is its key caps on
         one line with the description beneath, so every description in a
         row starts at the same height and every cell at its column's
         edge. Six across on a wide window, four at 800 px, three, then
         two; the column counts were picked to divide the twelve entries
         evenly, so since Phase 31's `m` row the thirteenth sits alone on
         the last line. */
      .help-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(6px, 1.2vh, 22px) clamp(14px, 2vw, 28px);
        margin: 0;
      }
      @media (min-width: 480px) {
        .help-list {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (min-width: 700px) {
        .help-list {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (min-width: 1100px) {
        .help-list {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }
      }
      .help-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: clamp(3px, 0.6vh, 8px);
        min-width: 0;
        padding-top: clamp(4px, 0.8vh, 10px);
        border-top: 1px solid rgba(244, 239, 230, 0.1);
      }
      /* The `m` row is a button (render/help.ts): it opens the branch
         map in this screen's place. Drawn exactly like the other rows
         until hovered or focused, when its rule and caps light up. */
      button.help-row {
        margin: 0;
        padding-right: 0;
        padding-bottom: 0;
        padding-left: 0;
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      /* The caps line: one cap per key word, a muted slash between
         alternatives; always one line tall so the descriptions in a row
         share a baseline. */
      .help-key {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35em;
        font-size: clamp(11px, 1.4vh, 15px);
      }
      .help-cap {
        box-sizing: border-box;
        min-width: 2.2em;
        padding: 0.1em 0.6em;
        border: 1px solid rgba(244, 239, 230, 0.3);
        border-bottom-width: 2px;
        border-radius: 5px;
        background: rgba(22, 22, 26, 0.95);
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: 0.04em;
        text-align: center;
      }
      .help-or {
        color: rgba(244, 239, 230, 0.45);
      }
      .help-desc {
        color: rgba(244, 239, 230, 0.68);
        font-size: clamp(11px, 1.45vh, 16px);
        line-height: 1.3;
      }
      /* The `t` row's hover / focus cue (button.help-row above). */
      button.help-row:hover,
      button.help-row:focus-visible {
        border-top-color: var(--accent);
        outline: none;
      }
      button.help-row:hover .help-cap,
      button.help-row:focus-visible .help-cap {
        border-color: var(--accent);
      }
      button.help-row:hover .help-desc,
      button.help-row:focus-visible .help-desc {
        color: var(--ink);
      }
      /* The settings under the keys (Phase 26), set apart by a rule and
         a band of space so the two areas read as two sections. */
      #help > #config {
        margin-top: clamp(2px, 1vh, 28px);
        padding-top: clamp(6px, 1.6vh, 32px);
        border-top: 1px solid rgba(244, 239, 230, 0.18);
      }
      /* Decision overlay (docs/plan.md Phase 13): the machine's open
         choice drawn as a prompt over its numbered routes. z 5: the
         branch map may open over it (z 6), and the Esc screen — the one screen that may open OVER a pending
         choice — stays above it at z 6; #flash (z 10) is unaffected.
         Rows are buttons so a pointer click is the row's own; the seen
         marker rides at the row's end. Look is minimal like the panels
         above: a later iteration with the user. */
      #choice {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(12px, 2.4vh, 28px);
        padding: clamp(16px, 3vh, 36px) clamp(20px, 6vw, 88px);
        background: rgba(8, 8, 10, 0.94);
        color: var(--ink);
        font-family: var(--ui-font);
      }
      #choice[hidden] {
        display: none;
      }
      .choice-title {
        margin: 0 auto;
        max-width: 60ch;
        color: var(--accent);
        font-size: clamp(16px, 2.4vh, 26px);
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: 0.02em;
        text-align: center;
      }
      .choice-hint {
        margin: 0;
        color: rgba(244, 239, 230, 0.55);
        font-size: clamp(10px, 1.2vh, 13px);
        text-align: center;
      }
      /* Rows are centered as whole rows (docs/plan.md Phase 16, Styling):
         `align-items: center` shrinks each button to its content and puts
         it on the panel's center line, so number badge, label and seen
         marker stay inline as one centered unit.
         Long lists (docs/progress.md, long choice lists): the list is the
         panel's only shrinking part — a scroll container's minimum height
         is 0, while the title, status and hint keep their content height —
         so rows that do not fit scroll inside it and the panel never grows
         past the window. The padding keeps a highlighted row's ring inside
         the scroll clip; `overscroll-behavior` stops a scroll reaching the
         page at either end. */
      .choice-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(6px, 1.2vh, 14px);
        margin: 0 auto;
        max-width: 72ch;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 4px 6px;
      }
      .choice-row {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2vw, 18px);
        padding: clamp(8px, 1.6vh, 16px) clamp(12px, 2vw, 22px);
        border: 1px solid rgba(244, 239, 230, 0.28);
        border-radius: 8px;
        background: rgba(18, 18, 22, 0.9);
        color: var(--ink);
        font: inherit;
        font-size: clamp(14px, 1.9vh, 21px);
        text-align: center;
        cursor: pointer;
      }
      .choice-row:hover,
      .choice-row:focus-visible,
      .choice-cursor {
        border-color: var(--accent);
        background: rgba(30, 28, 24, 0.95);
      }
      /* The keyboard's row cursor (ArrowUp / ArrowDown, Enter picks):
         an outline ring outside the border, so it reads apart from the
         play-all / walk highlight, which it may sit on. */
      .choice-cursor {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .choice-continue {
        border-style: dashed;
      }
      .choice-num {
        flex: none;
        min-width: 2.2em;
        padding: clamp(2px, 0.5vh, 5px) clamp(6px, 1.2vw, 12px);
        border: 1px solid rgba(244, 239, 230, 0.28);
        border-radius: 5px;
        background: rgba(10, 10, 12, 0.9);
        color: var(--accent);
        font-size: clamp(11px, 1.4vh, 16px);
        letter-spacing: 0.06em;
        text-align: center;
      }
      .choice-label {
        flex: 1;
        line-height: 1.4;
      }
      .choice-seen {
        flex: none;
        color: rgba(244, 239, 230, 0.5);
        font-size: clamp(10px, 1.2vh, 13px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      /* Play all routes (docs/plan.md Phase 20): the row it will pick,
         marked through the whole countdown — a softer form of the picked
         look below, which takes over for the last moment. */
      .choice-next {
        border-color: var(--accent);
        background: rgba(42, 35, 22, 0.95);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .choice-picked {
        border-color: var(--accent);
        background: rgba(60, 48, 26, 0.95);
        box-shadow: 0 0 0 2px var(--accent);
        font-weight: 600;
      }
      /* Play all routes (docs/plan.md Phase 18): the machine is about to
         answer — a status line over a bar that drains to the pick. */
      .choice-auto {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .choice-auto[hidden] {
        display: none;
      }
      .choice-auto-text {
        margin: 0;
        color: var(--ink);
        font-size: clamp(12px, 1.6vh, 17px);
        text-align: center;
      }
      .choice-auto-bar {
        width: min(320px, 60vw);
        height: 4px;
        border-radius: 2px;
        background: rgba(244, 239, 230, 0.18);
        overflow: hidden;
      }
      .choice-auto-fill {
        width: 100%;
        height: 100%;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- manifest.js sets window.KINETIC_MANIFEST and must run first: over
         file:// nothing can fetch manifest.json, so the manifest has to be
         embedded before app.js asks for it. -->
    <script src="manifest.js"></script>
    <script src="app.js"></script>
  </body>
</html>
