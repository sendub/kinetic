[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-extract"
version = "0.1.0"
description = "Ren'Py extractor for the Kinetic content format (docs/content-format.md)."
requires-python = ">=3.12"
dependencies = ["Pillow"]

[project.scripts]
kinetic-extract = "kinetic_extract.cli:main"

[tool.setuptools.packages.find]
include = ["kinetic_extract*"]
