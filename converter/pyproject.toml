[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-extract"
version = "1.12.0.dev0"
description = "Ren'Py extractor for the Kinetic content format (docs/content-format.md)."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Pillow==13.0.0", "imagecodecs==2026.10.10", "numpy==2.5.4"]

[project.scripts]
kinetic-extract = "kinetic_extract.cli:main"
kinetic-media = "kinetic_extract.media_cli:main"

[tool.setuptools.packages.find]
include = ["kinetic_extract*"]
